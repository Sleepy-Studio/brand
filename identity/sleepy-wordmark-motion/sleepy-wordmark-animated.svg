    animation: sleepy-e-middle-flicker 8.8s linear infinite;
  }

  .sleepy-e-replacement {
    opacity: 0;
    animation: sleepy-e-replacement 8.8s linear infinite;
  }

  .sleepy-e-replacement-gold {
    opacity: 0;
    animation: sleepy-e-replacement-gold 8.8s linear infinite;
  }

  .sleepy-e-top--second,
  .sleepy-e-bottom--second {
    animation-name: sleepy-e-flicker-second;
  }

  .sleepy-e-middle--second {
    animation-name: sleepy-e-middle-flicker-second;
  }

  .sleepy-e-replacement--second {
